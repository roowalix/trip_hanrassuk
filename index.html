            { id: 2, category: "교통/이동", title: "오토바이 주유비 (나고야)", amountJpy: 2500 },

        // State Variables
        let currentSelectedDay = 1;
        let daysConfig = JSON.parse(localStorage.getItem('japan_trip_days_config')) || defaultDaysConfig;
        let scheduleItems = JSON.parse(localStorage.getItem('japan_trip_schedules')) || defaultSchedules;
        let expenseItems = JSON.parse(localStorage.getItem('japan_trip_expenses')) || defaultExpenses;

        let map, mapMarkersGroup;

        // Initialization
        window.onload = function() {
            initInteractiveMap();
            renderDayTabs();
            renderDayInfo(1);
            renderScheduleList();
            renderExpenseList();
            setupForms();
        };

        // Initialize Leaflet Map
        function initInteractiveMap() {
            map = L.map('interactiveMap').setView([36.0474, 138.0831], 10);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                maxZoom: 19,
                subdomains: 'abcd',
                attribution: '&copy; OpenStreetMap &copy; CARTO'
            }).addTo(map);

            mapMarkersGroup = L.layerGroup().addTo(map);
        }

        // Update Map Markers for Current Selected Day
        function updateMapMarkers() {
            if (!map || !mapMarkersGroup) return;
            mapMarkersGroup.clearLayers();

            const currentDaySchedules = scheduleItems.filter(item => item.dayIndex === currentSelectedDay);
            const bounds = [];

            currentDaySchedules.forEach((item, idx) => {
                const lat = parseFloat(item.lat);
                const lng = parseFloat(item.lng);
                if (!isNaN(lat) && !isNaN(lng)) {
                    const marker = L.marker([lat, lng])
                        .bindPopup(`
                            <div class="p-1">
                                <b style="color:#0284c7; font-size:12px;">${idx + 1}. ${item.title}</b><br>
                                <span style="font-size:11px; color:#475569;">⏰ ${item.startTime} ~ ${item.endTime}</span><br>
                                ${item.memo ? `<span style="font-size:11px; color:#64748b;">📝 ${item.memo}</span>` : ''}
                            </div>
                        `);
                    mapMarkersGroup.addLayer(marker);
                    bounds.push([lat, lng]);
                }
            });

            if (bounds.length > 0) {
                map.fitBounds(bounds, { padding: [40, 40], maxZoom: 13 });
            } else {
                const config = daysConfig.find(d => d.dayIndex === currentSelectedDay);
                if (config && config.defaultLat && config.defaultLng) {
                    map.setView([config.defaultLat, config.defaultLng], 10);
                }
            }
        }

        // Focus Map to Specific Lat/Lng via Compass Button 🧭
        function focusMapLocation(latStr, lngStr, title, memo) {
            const lat = parseFloat(latStr);
            const lng = parseFloat(lngStr);

            if (isNaN(lat) || isNaN(lng)) {
                showToast("해당 장소의 위도/경도가 올바르게 입력되지 않았습니다.");
                return;
            }

            // Scroll smoothly up to the map section
            document.getElementById('interactiveMap').scrollIntoView({ behavior: 'smooth', block: 'center' });

            setTimeout(() => {
                map.setView([lat, lng], 14, { animate: true });
                // Find or create marker to open popup
                L.popup()
                    .setLatLng([lat, lng])
                    .setContent(`
                        <div class="p-1">
                            <b style="color:#0284c7; font-size:13px;">🧭 ${title}</b><br>
                            ${memo ? `<span style="font-size:11px; color:#475569;">📝 ${memo}</span>` : ''}
                        </div>
                    `)
                    .openOn(map);
                showToast(`지도에서 '${title}' 위치로 이동했습니다.`);
            }, 300);
        }

        // Save state to LocalStorage
        function saveData() {
            localStorage.setItem('japan_trip_days_config', JSON.stringify(daysConfig));
            localStorage.setItem('japan_trip_schedules', JSON.stringify(scheduleItems));
            localStorage.setItem('japan_trip_expenses', JSON.stringify(expenseItems));
        }

        // Render Day Horizontal Scroll Tabs
        function renderDayTabs() {
            const tabsContainer = document.getElementById('dayTabs');
            const daySelect = document.getElementById('inputDayIndex');

            tabsContainer.innerHTML = daysConfig.map(day => `
                <button onclick="selectDay(${day.dayIndex})" 
                        class="day-btn-${day.dayIndex} px-3.5 py-2 bg-slate-100 text-slate-600 rounded-xl text-xs font-semibold whitespace-nowrap hover:bg-slate-200 transition">
                    ${day.dateLabel}
                </button>
            `).join('');

            daySelect.innerHTML = daysConfig.map(day => `
                <option value="${day.dayIndex}">${day.dayIndex}일차 - ${day.dateLabel}</option>
            `).join('');

            updateActiveTabUI();
        }

        function updateActiveTabUI() {
            daysConfig.forEach(day => {
                const btn = document.querySelector(`.day-btn-${day.dayIndex}`);
                if (btn) {
                    if (day.dayIndex === currentSelectedDay) {
                        btn.className = `day-btn-${day.dayIndex} px-3.5 py-2 day-active rounded-xl text-xs font-bold whitespace-nowrap shadow-sm transition`;
                    } else {
                        btn.className = `day-btn-${day.dayIndex} px-3.5 py-2 bg-slate-100 text-slate-600 rounded-xl text-xs font-semibold whitespace-nowrap hover:bg-slate-200 transition`;
                    }
                }
            });
        }

        // Select Active Day
        function selectDay(dayIndex) {
            currentSelectedDay = dayIndex;
            updateActiveTabUI();
            renderDayInfo(dayIndex);
            renderScheduleList();
        }

        // Render Day Information & Update Interactive Map
        function renderDayInfo(dayIndex) {
            const config = daysConfig.find(d => d.dayIndex === dayIndex);
            if (!config) return;

            const fullDate = config.fullDateStr || config.dateLabel;
            document.getElementById('currentDayHeader').innerText = `${config.dayIndex}일차 : ${fullDate}`;
            document.getElementById('destCityName').innerText = config.city;
            document.getElementById('destSummary').innerText = config.summary;
            document.getElementById('destFoodText').innerText = config.food;
            document.getElementById('destActivityText').innerText = config.activity;
            document.getElementById('scheduleTableDateLabel').innerText = config.dateLabel;

            document.getElementById('googleMapExternalBtn').href = config.externalMap || '#';

            updateMapMarkers();
        }

        // --- DIRECT EDITING DAY INFO MODAL FUNCTIONS ---
        function openEditDayModal() {
            const config = daysConfig.find(d => d.dayIndex === currentSelectedDay);
            if (!config) return;

            document.getElementById('modalDayTitle').innerText = `${config.dayIndex}일차 (${config.dateLabel}) 정보 수정하기`;
            document.getElementById('editModalCity').value = config.city || "";
            document.getElementById('editModalSummary').value = config.summary || "";
            document.getElementById('editModalFood').value = config.food || "";
            document.getElementById('editModalActivity').value = config.activity || "";
            document.getElementById('editModalExternalMap').value = config.externalMap || "";

            document.getElementById('editDayModal').classList.remove('hidden');
        }

        function closeEditDayModal() {
            document.getElementById('editDayModal').classList.add('hidden');
        }

        function saveEditDayModal() {
            const index = daysConfig.findIndex(d => d.dayIndex === currentSelectedDay);
            if (index === -1) return;

            daysConfig[index].city = document.getElementById('editModalCity').value;
            daysConfig[index].summary = document.getElementById('editModalSummary').value;
            daysConfig[index].food = document.getElementById('editModalFood').value;
            daysConfig[index].activity = document.getElementById('editModalActivity').value;
            daysConfig[index].externalMap = document.getElementById('editModalExternalMap').value;

            saveData();
            renderDayInfo(currentSelectedDay);
            closeEditDayModal();
            showToast(`${currentSelectedDay}일차 정보가 성공적으로 저장되었습니다! ✨`);
        }

        // Render Schedules for Current Day (Lat/Lng Hidden, Compass 🧭 Focus Button Added)
        function renderScheduleList() {
            const container = document.getElementById('scheduleList');
            const filtered = scheduleItems.filter(item => item.dayIndex === currentSelectedDay);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-6 text-slate-400 text-xs">
                        등록된 일정이 없습니다. 위 '새 일정 항목 추가하기'를 눌러 일정을 입력해보세요!
                    </div>
                `;
                return;
            }

            filtered.sort((a, b) => a.startTime.localeCompare(b.startTime));

            container.innerHTML = filtered.map((item, idx) => {
                const hasLatLng = item.lat && item.lng && !isNaN(parseFloat(item.lat)) && !isNaN(parseFloat(item.lng));
                return `
                <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl flex items-start justify-between hover:border-sky-300 transition">
                    <div class="flex items-start space-x-3">
                        <span class="bg-sky-600 text-white w-6 h-6 rounded-full flex items-center justify-center font-bold text-xs shrink-0 mt-0.5">
                            ${idx + 1}
                        </span>
                        <div>
                            <div class="flex items-center space-x-2">
                                <span class="bg-sky-100 text-sky-700 px-2 py-0.5 rounded font-semibold text-[11px]">
                                    <i class="fa-regular fa-clock mr-1"></i>${item.startTime} ~ ${item.endTime}
                                </span>
                                <h4 class="font-bold text-slate-800 text-xs sm:text-sm">${item.title}</h4>
                            </div>
                            ${item.memo ? `<p class="text-xs text-slate-500 mt-1"><i class="fa-regular fa-note-sticky mr-1"></i>${item.memo}</p>` : ''}
                        </div>
                    </div>
                    <div class="flex items-center space-x-1 shrink-0">
                        ${hasLatLng ? `
                            <button onclick="focusMapLocation('${item.lat}', '${item.lng}', '${item.title.replace(/'/g, "\\'")}', '${(item.memo || '').replace(/'/g, "\\'")}')" 
                                    class="bg-sky-50 text-sky-600 hover:bg-sky-100 p-1.5 rounded-lg text-xs font-bold flex items-center transition" 
                                    title="지도에서 장소 위치 보기">
                                <span class="mr-1">🧭</span>
                                <span class="text-[11px] hidden sm:inline">위치보기</span>
                            </button>
                        ` : ''}
                        <button onclick="editSchedule(${item.id})" class="text-slate-400 hover:text-sky-600 p-1.5 text-xs transition" title="수정">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                        <button onclick="deleteSchedule(${item.id})" class="text-slate-300 hover:text-rose-500 p-1.5 text-xs transition" title="삭제">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                </div>
            `}).join('');

            updateMapMarkers();
        }

        // Edit Schedule Item
        function editSchedule(id) {
            const item = scheduleItems.find(i => i.id === id);
            if (!item) return;

            document.getElementById('editingScheduleId').value = item.id;
            document.getElementById('inputDayIndex').value = item.dayIndex;
            document.getElementById('inputStartTime').value = item.startTime;
            document.getElementById('inputEndTime').value = item.endTime;
            document.getElementById('inputTitle').value = item.title;
            document.getElementById('inputLat').value = item.lat || '';
            document.getElementById('inputLng').value = item.lng || '';
            document.getElementById('inputMemo').value = item.memo || '';

            document.getElementById('submitScheduleBtn').innerText = "일정 수정 완료";
            document.getElementById('cancelEditScheduleBtn').classList.remove('hidden');

            const form = document.getElementById('addScheduleForm');
            if (form.classList.contains('hidden')) toggleForm();
            form.scrollIntoView({ behavior: 'smooth' });
        }

        function cancelScheduleEdit() {
            document.getElementById('addScheduleForm').reset();
            document.getElementById('editingScheduleId').value = "";
            document.getElementById('submitScheduleBtn').innerText = "일정 등록";
            document.getElementById('cancelEditScheduleBtn').classList.add('hidden');
        }

        function deleteSchedule(id) {
            scheduleItems = scheduleItems.filter(item => item.id !== id);
            saveData();
            renderScheduleList();
            showToast("일정이 삭제되었습니다.");
        }

        // Render Expenses & JPY -> KRW Calculations
        function renderExpenseList() {
            const container = document.getElementById('expenseList');
            let totalJpy = 0;
            let catSums = { "숙소/항공": 0, "교통/이동": 0, "식사/간식": 0, "관람/체험": 0, "쇼핑/기타": 0 };

            expenseItems.forEach(item => {
                const amt = Number(item.amountJpy);
                totalJpy += amt;
                if (catSums[item.category] !== undefined) {
                    catSums[item.category] += amt;
                } else {
                    catSums["쇼핑/기타"] += amt;
                }
            });

            const totalKrw = Math.round(totalJpy * EXCHANGE_RATE);

            document.getElementById('totalJpyDisplay').innerText = `¥ ${totalJpy.toLocaleString()}`;
            document.getElementById('totalKrwDisplay').innerText = `(${totalKrw.toLocaleString()} 원)`;

            document.getElementById('catStay').innerText = `¥${catSums["숙소/항공"].toLocaleString()}`;
            document.getElementById('catTransport').innerText = `¥${catSums["교통/이동"].toLocaleString()}`;
            document.getElementById('catFood').innerText = `¥${catSums["식사/간식"].toLocaleString()}`;
            document.getElementById('catActivity').innerText = `¥${catSums["관람/체험"].toLocaleString()}`;
            document.getElementById('catEtc').innerText = `¥${catSums["쇼핑/기타"].toLocaleString()}`;

            if (expenseItems.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">등록된 지출 내역이 없습니다.</p>`;
                return;
            }

            container.innerHTML = expenseItems.map(item => {
                const krwVal = Math.round(Number(item.amountJpy) * EXCHANGE_RATE);
                return `
                    <div class="py-2.5 flex justify-between items-center text-xs">
                        <div>
                            <span class="font-bold text-slate-800">${item.title}</span>
                            <span class="text-[10px] text-slate-500 bg-slate-100 border px-1.5 py-0.5 rounded ml-1.5">${item.category}</span>
                        </div>
                        <div class="flex items-center space-x-3">
                            <div class="text-right">
                                <span class="font-bold text-slate-800 block">¥ ${Number(item.amountJpy).toLocaleString()}</span>
                                <span class="text-[10px] text-sky-600">(${krwVal.toLocaleString()} 원)</span>
                            </div>
                            <button onclick="deleteExpense(${item.id})" class="text-slate-300 hover:text-rose-500 transition">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function deleteExpense(id) {
            expenseItems = expenseItems.filter(item => item.id !== id);
            saveData();
            renderExpenseList();
            showToast("지출 내역이 삭제되었습니다.");
        }

        // Setup Forms & Event Handlers
        function setupForms() {
            document.getElementById('addScheduleForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const editingId = document.getElementById('editingScheduleId').value;
                const dayIndex = Number(document.getElementById('inputDayIndex').value);
                const startTime = document.getElementById('inputStartTime').value;
                const endTime = document.getElementById('inputEndTime').value;
                const title = document.getElementById('inputTitle').value;
                const lat = document.getElementById('inputLat').value;
                const lng = document.getElementById('inputLng').value;
                const memo = document.getElementById('inputMemo').value;

                if (editingId) {
                    const idx = scheduleItems.findIndex(i => i.id == editingId);
                    if (idx !== -1) {
                        scheduleItems[idx] = { id: Number(editingId), dayIndex, startTime, endTime, title, lat, lng, memo };
                        showToast("일정이 수정되었습니다!");
                    }
                } else {
                    scheduleItems.push({ id: Date.now(), dayIndex, startTime, endTime, title, lat, lng, memo });
                    showToast("새 일정이 추가되었습니다!");
                }

                saveData();
                selectDay(dayIndex);
                cancelScheduleEdit();
                toggleForm();
            });

            document.getElementById('addExpenseForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const category = document.getElementById('expCategory').value;
                const title = document.getElementById('expTitle').value;
                const amountJpy = Number(document.getElementById('expAmountJpy').value);

                expenseItems.push({ id: Date.now(), category, title, amountJpy });
                saveData();
                renderExpenseList();
                this.reset();
                showToast("지출 내역이 추가되었습니다.");
            });
        }

        // UI Helpers
        function switchTab(tab) {
            const schedSection = document.getElementById('tabSchedule');
            const expSection = document.getElementById('tabExpense');
            const schedBtn = document.getElementById('tabSchedBtn');
            const expBtn = document.getElementById('tabExpBtn');

            if (tab === 'schedule') {
                schedSection.classList.remove('hidden');
                expSection.classList.add('hidden');
                schedBtn.className = "flex-1 py-3 text-center font-bold text-xs sm:text-sm tab-active flex justify-center items-center space-x-2";
                expBtn.className = "flex-1 py-3 text-center font-bold text-xs sm:text-sm text-slate-400 flex justify-center items-center space-x-2";
                setTimeout(() => { if (map) map.invalidateSize(); }, 200);
            } else {
                schedSection.classList.add('hidden');
                expSection.classList.remove('hidden');
                expBtn.className = "flex-1 py-3 text-center font-bold text-xs sm:text-sm tab-active flex justify-center items-center space-x-2";
                schedBtn.className = "flex-1 py-3 text-center font-bold text-xs sm:text-sm text-slate-400 flex justify-center items-center space-x-2";
            }
        }

        function toggleForm() {
            const form = document.getElementById('addScheduleForm');
            const icon = document.getElementById('formIcon');
            form.classList.toggle('hidden');
            icon.classList.toggle('rotate-180');
        }

        function shareLink() {
            navigator.clipboard.writeText(window.location.href);
            showToast("공유 링크가 클립보드에 복사되었습니다!");
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
