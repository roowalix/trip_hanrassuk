<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> 2026 우리 가족 일본 여행 👀</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Leaflet CSS & JS (지도) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    #map { height: 320px; width: 100%; z-index: 1; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-12">

  <!-- 1. 최상단 날씨 얇은 바 -->
  <div class="bg-sky-700 text-white text-xs sm:text-sm py-2 px-4 shadow-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="bg-sky-800 text-sky-200 px-2 py-0.5 rounded font-bold text-xs">날씨</span>
        <span class="font-medium">제주 24°C 맑음 ☀️</span>
        <span class="hidden sm:inline text-sky-200">| 최고 26° / 최저 19°</span>
      </div>
      <a href="https://weather.com/ko-KR/weather/today/l/33.4996,126.5312" target="_blank" rel="noopener noreferrer" class="hover:underline flex items-center space-x-1 text-sky-100 font-medium">
        <span>상세 기상예보 보기</span>
        <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
      </a>
    </div>
  </div>

  <div class="max-w-4xl mx-auto px-4 pt-4 space-y-4">
    <!-- 헤더 & 백업 메뉴 -->
    <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white p-4 rounded-xl shadow-sm border border-slate-100">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2" id="display-title">
          2026 우리 가족 일본 여행 👀
        </h1>
        <p class="text-xs text-slate-500 mt-1" id="display-dates">2026.11.11 - 11.18 (7박 8일)</p>
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <button onclick="copyBackupData()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1">
          <i class="fa-solid fa-copy"></i> 백업(텍스트 복사)
        </button>
        <button onclick="restoreBackupData()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1">
          <i class="fa-solid fa-download"></i> 불러오기
        </button>
        <button onclick="resetData()" class="text-slate-400 hover:text-red-500 text-xs px-2 py-1.5 transition">
          <i class="fa-solid fa-rotate-left"></i>
        </button>
      </div>
    </header>

    <!-- 2. 오늘의 여행 꿀팁 & 명소 가이드 (접기/펼치기 가능 + 직관적 수정) -->
     <div class="bg-gradient-to-r from-sky-100 to-sky-200 rounded-xl text-slate-800 border border-sky-300/50 shadow-sm overflow-hidden transition-all">      <div class="p-4 flex items-center justify-between cursor-pointer select-none" onclick="toggleCard()">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-lightbulb text-amber-200 text-lg"></i>
          <h2 class="font-bold text-base sm:text-lg">오늘의 여행 꿀팁 & 명소 가이드</h2>
        </div>
        <div class="flex items-center space-x-2">
          <button onclick="event.stopPropagation(); openEditTipsModal();" class="bg-white/20 hover:bg-white/30 text-white text-xs px-2.5 py-1 rounded-md font-medium transition flex items-center gap-1">
            <i class="fa-solid fa-pen"></i> 꿀팁 수정
          </button>
          <i id="toggle-icon" class="fa-solid fa-chevron-up transition-transform duration-300"></i>
        </div>
      </div>
      
      <div id="card-content" class="px-4 pb-4 space-y-3 border-t border-white/20 pt-3 text-sm">
        <div class="bg-white/10 rounded-lg p-3">
          <p class="font-semibold text-amber-100 text-xs mb-1">📍 1일차 대표 여행지</p>
          <p id="tip-intro">용두암 & 함덕해수욕장 - 에메랄드빛 바다와 멋진 하안도로 라이딩 코스</p>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs sm:text-sm">
          <div class="bg-white/10 rounded-lg p-2.5">
            <span class="font-semibold text-amber-200">🍴 추천 먹거리:</span> 
            <span id="tip-food">함덕 해물라면, 고기국수, 갈치조림</span>
          </div>
          <div class="bg-white/10 rounded-lg p-2.5">
            <span class="font-semibold text-amber-200">🏍️ 즐길거리:</span> 
            <span id="tip-play">해안도로 스쿠터 라이딩, 카약 체험</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 3. 고정 지도 카드 -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-4 space-y-2">
      <div class="flex items-center justify-between">
        <h2 class="font-bold text-slate-800 flex items-center gap-2 text-sm sm:text-base">
          <i class="fa-solid fa-map-location-dot text-sky-600"></i> 여행 지도 (일정 클릭 시 해당 위치 이동)
        </h2>
        <span class="text-xs text-slate-400">CartoDB Map</span>
      </div>
      <div id="map" class="rounded-lg border border-slate-200"></div>
    </div>

    <!-- 4. 일정표 및 예산 탭 -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
      <div class="flex border-b border-slate-200">
        <button id="tab-schedule-btn" onclick="switchTab('schedule')" class="flex-1 py-3 text-center font-bold text-sm text-sky-600 border-b-2 border-sky-600">
          🗓️ 일정 공유
        </button>
        <button id="tab-budget-btn" onclick="switchTab('budget')" class="flex-1 py-3 text-center font-bold text-sm text-slate-400 hover:text-slate-600">
          💰 총 예산 & 정산
        </button>
      </div>

      <!-- 일정 탭 컨텐츠 -->
      <div id="tab-schedule-content" class="p-4 space-y-4">
        <!-- 일차 선택 -->
        <div class="flex space-x-2 overflow-x-auto pb-2 no-scrollbar" id="day-buttons">
          <!-- JS로 일차 버튼 생성 -->
        </div>

        <!-- 새 일정 추가 버튼 -->
        <form onsubmit="addSchedule(event)" class="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-2">
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
            <input type="time" id="sched-start" required class="p-1.5 text-xs rounded border border-slate-300">
            <input type="time" id="sched-end" required class="p-1.5 text-xs rounded border border-slate-300">
            <input type="text" id="sched-title" placeholder="장소 / 일정 이름" required class="p-1.5 text-xs rounded border border-slate-300 col-span-2 sm:col-span-2">
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
            <input type="number" step="any" id="sched-lat" placeholder="위도(Lat) 예: 33.4996" class="p-1.5 text-xs rounded border border-slate-300">
            <input type="number" step="any" id="sched-lng" placeholder="경도(Lng) 예: 126.5312" class="p-1.5 text-xs rounded border border-slate-300">
            <input type="text" id="sched-memo" placeholder="메모 (예: 꿀팁, 준비물)" class="p-1.5 text-xs rounded border border-slate-300 col-span-2 sm:col-span-1">
          </div>
          <button type="submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold py-2 rounded transition">
            + 일정 추가하기
          </button>
        </form>

        <!-- 일정 목록 -->
        <div id="schedule-list" class="space-y-2">
          <!-- JS dynamic -->
        </div>
      </div>

      <!-- 예산 탭 컨텐츠 -->
      <div id="tab-budget-content" class="p-4 space-y-4 hidden">
        <div class="bg-sky-50 p-4 rounded-xl border border-sky-100 flex items-center justify-between">
          <div>
            <span class="text-xs text-sky-600 font-bold">현재 총 지출 합계</span>
            <h3 class="text-2xl font-extrabold text-sky-900" id="total-budget-sum">0원</h3>
          </div>
          <i class="fa-solid fa-calculator text-3xl text-sky-300"></i>
        </div>

        <form onsubmit="addBudget(event)" class="bg-slate-50 p-3 rounded-lg border border-slate-200 flex flex-wrap gap-2">
          <input type="text" id="budget-title" placeholder="항목명 (예: 렌트카)" required class="flex-1 p-1.5 text-xs rounded border border-slate-300 min-w-[120px]">
          <input type="number" id="budget-amount" placeholder="금액(원)" required class="w-28 p-1.5 text-xs rounded border border-slate-300">
          <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded transition">
            + 지출 추가
          </button>
        </form>

        <div id="budget-list" class="space-y-2">
          <!-- JS dynamic -->
        </div>
      </div>
    </div>
  </div>

  <!-- 꿀팁 수정 모달 -->
  <div id="tips-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-xl max-w-md w-full p-5 space-y-4 shadow-xl">
      <h3 class="font-bold text-lg text-slate-800">오늘의 꿀팁 & 명소 수정</h3>
      <div class="space-y-3 text-xs sm:text-sm">
        <div>
          <label class="block font-medium text-slate-600 mb-1">대표 여행지 소개</label>
          <input type="text" id="edit-tip-intro" class="w-full p-2 border border-slate-300 rounded">
        </div>
        <div>
          <label class="block font-medium text-slate-600 mb-1">추천 먹거리</label>
          <input type="text" id="edit-tip-food" class="w-full p-2 border border-slate-300 rounded">
        </div>
        <div>
          <label class="block font-medium text-slate-600 mb-1">즐길거리 / 가볼 만한 곳</label>
          <input type="text" id="edit-tip-play" class="w-full p-2 border border-slate-300 rounded">
        </div>
      </div>
      <div class="flex justify-end space-x-2 pt-2">
        <button onclick="closeEditTipsModal()" class="px-3 py-1.5 text-xs text-slate-500 hover:bg-slate-100 rounded">취소</button>
        <button onclick="saveEditTips()" class="px-3 py-1.5 text-xs bg-amber-500 text-white font-bold rounded hover:bg-amber-600">저장</button>
      </div>
    </div>
  </div>

  <script>
    // 기본 초기 데이터
    const defaultData = {
      title: "우리 가족 제주 여행 🌴",
      dates: "2026.06.12 - 06.15 (3박 4일)",
      currentDay: 1,
      tips: {
        1: { intro: "용두암 & 함덕해수욕장 - 에메랄드빛 바다와 멋진 하안도로 라이딩 코스", food: "함덕 해물라면, 고기국수", play: "해안도로 스쿠터 라이딩, 카약" },
        2: { intro: "성산일출봉 & 섭지코지 - 제주 동쪽의 웅장한 자연 경관", food: "갈치조림, 흑돼지 구이", play: "성산 일출 감상, 해안 산책" },
        3: { intro: "서귀포 올레시장 & 천지연폭포 - 먹거리 폭발 시장 투어", food: "마늘치킨, 오메기떡, 귤하르방빵", play: "야시장 탐방, 폭포 산책" },
        4: { intro: "협재해수욕장 & 한림공원 - 맑은 바다 보며 여행 마무리", food: "보목 해녀물회, 카페 라떼", play: "기념품 쇼핑, 공원 산책" }
      },
      schedules: [
        { day: 1, start: "10:00", end: "11:30", title: "제주공항 도착 & 렌트카 수령", lat: 33.5066, lng: 126.4931, memo: "도착 후 5번 게이트로 이동" },
        { day: 1, start: "12:00", end: "13:00", title: "점심 식사 (고기국수)", lat: 33.5080, lng: 126.5270, memo: "자매국수 추천" },
        { day: 1, start: "14:00", end: "16:30", title: "함덕해수욕장 라이딩 & 카페", lat: 33.5434, lng: 126.6692, memo: "해안도로 경치 최고" },
        { day: 2, start: "09:30", end: "12:00", title: "성산일출봉 등반", lat: 33.4581, lng: 126.9426, memo: "편한 신발 착용" }
      ],
      budgets: [
        { id: 1, title: "항공권 (가족 합계)", amount: 450000 },
        { id: 2, title: "숙소 (3박)", amount: 520000 },
        { id: 3, title: "렌트카 & 기름값", amount: 180000 }
      ]
    };

    let tripData = JSON.parse(localStorage.getItem('family_trip_data')) || defaultData;
    let map, markers = [];

    // 지도 초기화
    function initMap() {
      map = L.map('map').setView([33.4996, 126.5312], 10);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap, © CARTO'
      }).addTo(map);
      updateMarkers();
    }

    function updateMarkers() {
      markers.forEach(m => map.removeLayer(m));
      markers = [];
      const dayScheds = tripData.schedules.filter(s => s.day === tripData.currentDay);
      
      const points = [];
      dayScheds.forEach(s => {
        if (s.lat && s.lng) {
          const marker = L.marker([s.lat, s.lng]).addTo(map)
            .bindPopup(`<b>${s.start}~${s.end}</b><br>${s.title}`);
          markers.push(marker);
          points.push([s.lat, s.lng]);
        }
      });

      if (points.length > 0) {
        map.fitBounds(points, { padding: [30, 30] });
      }
    }

    function renderUI() {
      // 일차 버튼
      const dayBtns = document.getElementById('day-buttons');
      dayBtns.innerHTML = '';
      for (let i = 1; i <= 4; i++) {
        const btn = document.createElement('button');
        btn.className = `px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap transition ${tripData.currentDay === i ? 'bg-sky-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`;
        btn.innerText = `${i}일차`;
        btn.onclick = () => { tripData.currentDay = i; saveAndRender(); };
        dayBtns.appendChild(btn);
      }

      // 꿀팁 업데이트
      const currentTip = tripData.tips[tripData.currentDay] || { intro: '-', food: '-', play: '-' };
      document.getElementById('tip-intro').innerText = currentTip.intro;
      document.getElementById('tip-food').innerText = currentTip.food;
      document.getElementById('tip-play').innerText = currentTip.play;

      // 일정 목록
      const list = document.getElementById('schedule-list');
      list.innerHTML = '';
      const dayScheds = tripData.schedules.filter(s => s.day === tripData.currentDay);
      
      if (dayScheds.length === 0) {
        list.innerHTML = '<p class="text-center text-xs text-slate-400 py-4">등록된 일정이 없습니다. 위에 새로 추가해 보세요!</p>';
      } else {
        dayScheds.forEach((s, idx) => {
          const item = document.createElement('div');
          item.className = 'bg-slate-50 p-3 rounded-lg border border-slate-200 flex items-center justify-between text-xs hover:border-sky-300 transition cursor-pointer';
          item.onclick = () => { if(s.lat && s.lng) map.setView([s.lat, s.lng], 13); };
          item.innerHTML = `
            <div class="space-y-1">
              <div class="flex items-center space-x-2">
                <span class="bg-sky-100 text-sky-700 font-bold px-1.5 py-0.5 rounded text-[10px]">${s.start} ~ ${s.end}</span>
                <span class="font-bold text-slate-800">${s.title}</span>
              </div>
              ${s.memo ? `<p class="text-slate-500 text-[11px]"><i class="fa-solid fa-sticky-note text-amber-500"></i> ${s.memo}</p>` : ''}
            </div>
            <button onclick="event.stopPropagation(); deleteSchedule(${idx})" class="text-slate-400 hover:text-red-500 p-1">
              <i class="fa-solid fa-trash"></i>
            </button>
          `;
          list.appendChild(item);
        });
      }

      // 예산 목록 및 합계
      const budgetList = document.getElementById('budget-list');
      budgetList.innerHTML = '';
      let sum = 0;
      tripData.budgets.forEach((b, idx) => {
        sum += Number(b.amount);
        const item = document.createElement('div');
        item.className = 'flex justify-between items-center p-2.5 bg-slate-50 rounded-lg text-xs border border-slate-100';
        item.innerHTML = `
          <span class="font-medium text-slate-700">${b.title}</span>
          <div class="flex items-center space-x-3">
            <span class="font-bold text-slate-900">${Number(b.amount).toLocaleString()}원</span>
            <button onclick="deleteBudget(${idx})" class="text-slate-400 hover:text-red-500"><i class="fa-solid fa-xmark"></i></button>
          </div>
        `;
        budgetList.appendChild(item);
      });
      document.getElementById('total-budget-sum').innerText = sum.toLocaleString() + '원';

      if (map) updateMarkers();
    }

    function saveAndRender() {
      localStorage.setItem('family_trip_data', JSON.stringify(tripData));
      renderUI();
    }

    function addSchedule(e) {
      e.preventDefault();
      const start = document.getElementById('sched-start').value;
      const end = document.getElementById('sched-end').value;
      const title = document.getElementById('sched-title').value;
      const lat = parseFloat(document.getElementById('sched-lat').value) || null;
      const lng = parseFloat(document.getElementById('sched-lng').value) || null;
      const memo = document.getElementById('sched-memo').value;

      tripData.schedules.push({ day: tripData.currentDay, start, end, title, lat, lng, memo });
      saveAndRender();
      e.target.reset();
    }

    function deleteSchedule(idx) {
      const dayScheds = tripData.schedules.filter(s => s.day === tripData.currentDay);
      const target = dayScheds[idx];
      tripData.schedules = tripData.schedules.filter(s => s !== target);
      saveAndRender();
    }

    function addBudget(e) {
      e.preventDefault();
      const title = document.getElementById('budget-title').value;
      const amount = parseInt(document.getElementById('budget-amount').value);
      tripData.budgets.push({ id: Date.now(), title, amount });
      saveAndRender();
      e.target.reset();
    }

    function deleteBudget(idx) {
      tripData.budgets.splice(idx, 1);
      saveAndRender();
    }

    function toggleCard() {
      const content = document.getElementById('card-content');
      const icon = document.getElementById('toggle-icon');
      content.classList.toggle('hidden');
      icon.classList.toggle('rotate-180');
    }

    function switchTab(tab) {
      document.getElementById('tab-schedule-content').classList.toggle('hidden', tab !== 'schedule');
      document.getElementById('tab-budget-content').classList.toggle('hidden', tab !== 'budget');
      document.getElementById('tab-schedule-btn').className = `flex-1 py-3 text-center font-bold text-sm ${tab === 'schedule' ? 'text-sky-600 border-b-2 border-sky-600' : 'text-slate-400 hover:text-slate-600'}`;
      document.getElementById('tab-budget-btn').className = `flex-1 py-3 text-center font-bold text-sm ${tab === 'budget' ? 'text-sky-600 border-b-2 border-sky-600' : 'text-slate-400 hover:text-slate-600'}`;
    }

    function openEditTipsModal() {
      const current = tripData.tips[tripData.currentDay] || {};
      document.getElementById('edit-tip-intro').value = current.intro || '';
      document.getElementById('edit-tip-food').value = current.food || '';
      document.getElementById('edit-tip-play').value = current.play || '';
      document.getElementById('tips-modal').classList.remove('hidden');
    }

    function closeEditTipsModal() {
      document.getElementById('tips-modal').classList.add('hidden');
    }

    function saveEditTips() {
      tripData.tips[tripData.currentDay] = {
        intro: document.getElementById('edit-tip-intro').value,
        food: document.getElementById('edit-tip-food').value,
        play: document.getElementById('edit-tip-play').value
      };
      saveAndRender();
      closeEditTipsModal();
    }

    function copyBackupData() {
      navigator.clipboard.writeText(JSON.stringify(tripData));
      alert('백업 데이터가 클립보드에 복사되었습니다! 메모장이나 카톡에 붙여넣어 보관하세요.');
    }

    function restoreBackupData() {
      const input = prompt('복사해 둔 백업 텍스트를 여기에 붙여넣어 주세요:');
      if (input) {
        try {
          tripData = JSON.parse(input);
          saveAndRender();
          alert('데이터가 성공적으로 복원되었습니다!');
        } catch (e) {
          alert('올바르지 않은 백업 데이터 형식입니다.');
        }
      }
    }

    function resetData() {
      if (confirm('초기 샘플 데이터로 되돌리시겠습니까?')) {
        tripData = JSON.parse(JSON.stringify(defaultData));
        saveAndRender();
      }
    }

    window.onload = () => {
      initMap();
      renderUI();
    };
  </script>
</body>
</html>
